  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#95d86b"/><stop offset="1" stop-color="#4ea44d"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59c8e8"/><stop offset="1" stop-color="#187aa9"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".25"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<circle cx="1120" cy="95" r="52" fill="#ffe38a"/>
