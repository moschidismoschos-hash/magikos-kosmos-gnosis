</g>
<path d="M0 330 C170 210 280 260 410 330 C560 180 730 190 860 330 C1000 210 1140 240 1280 330 L1280 720 L0 720 Z" fill="#6d9f59"/>
<path d="M0 380 C180 290 300 330 430 390 C620 280 760 300 930 395 C1080 310 1180 340 1280 390 L1280 720 L0 720 Z" fill="url(#grass)"/>
<path d="M520 360 C690 390 720 470 640 530 C570 580 610 650 740 720 L1030 720 C900 650 850 560 930 490 C1010 420 920 365 790 350 Z" fill="url(#water)" opacity=".95"/>
<path d="M75 565 C260 490 360 510 520 575" fill="none" stroke="#d9c28a" stroke-width="48" stroke-linecap="round"/>
<path d="M75 565 C260 490 360 510 520 575" fill="none" stroke="#f1dfaf" stroke-width="28" stroke-linecap="round"/>

