name: Δημιουργία APK Αντρόιντ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Λήψη έργου
        uses: actions/checkout@v4

      - name: Εγκατάσταση Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Εγκατάσταση Android SDK
        uses: android-actions/setup-android@v3

      - name: Εγκατάσταση εργαλείων Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Εγκατάσταση Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Εγκατάσταση προτύπων εξαγωγής Godot
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Ρύθμιση Godot για Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Δημιουργία κλειδιού εγκατάστασης
        run: |
          rm -f debug.keystore
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=GR"

      - name: Καθαρισμός και εισαγωγή έργου
        run: |
          rm -rf .godot build/android
          mkdir -p build/android
          godot --headless --editor --quit --path .

      - name: Έλεγχος νέας αρχικής οθόνης
        run: |
          grep 'run/main_scene="res://home_menu.tscn"' project.godot
          grep 'ΝΕΑ ΕΚΔΟΣΗ APK 2' scripts/home_menu.gd

      - name: Κατασκευή APK
        run: |
          echo "Έλεγχος προφίλ εξαγωγής:"
          cat export_presets.cfg
          echo
          godot --headless --verbose --path . --export-debug "Android APK" build/android/MagikosKosmosGnosis-v2.apk
          test -f build/android/MagikosKosmosGnosis-v2.apk
          ls -lh build/android/MagikosKosmosGnosis-v2.apk

      - name: Ανέβασμα APK για λήψη
        uses: actions/upload-artifact@v4
        with:
          name: MagikosKosmosGnosis-APK-v2
          path: build/android/MagikosKosmosGnosis-v2.apk
          if-no-files-found: error
          retention-days: 30
